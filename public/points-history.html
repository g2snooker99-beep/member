<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>G2 อันดับย้อนหลังทั้งร้าน</title>
<link rel="stylesheet" href="./css/style.css"/>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
body{color:#fff;background:radial-gradient(circle at top,#143924,#06120b 70%);font-family:Arial,sans-serif}
.wrap{max-width:560px;margin:24px auto;padding:22px;border:1px solid #277447;background:#091810;border-radius:22px}
h1{text-align:center;font-size:25px;margin:6px 0} .muted{color:#a6cbb4;font-size:13px;line-height:1.6}
select{width:100%;background:#172b20;color:#fff;border:1px solid #3c8058;border-radius:12px;padding:13px;font-size:16px;margin:10px 0}
.ranking-row{display:flex;gap:12px;align-items:center;padding:13px 6px;border-bottom:1px solid #294131}
.avatar{width:46px;height:46px;object-fit:cover;border-radius:50%;background:#183323}
.rank{width:34px;text-align:center;font-weight:bold;flex-shrink:0}
.name{min-width:0;flex:1;overflow-wrap:anywhere}
.points{font-weight:800;color:#71ffa3;font-size:20px;white-space:nowrap}
.total{background:#17291e;border-radius:12px;padding:14px;margin:14px 0}
a{color:#b5ff81} .center{text-align:center}
</style>
</head>
<body><main class="wrap">
<h1>🏆 G2 SNOOKER</h1>
<p class="center muted">อันดับสะสมแต้มย้อนหลังทั้งร้าน • สูงสุดไปต่ำสุด</p>
<label for="month">เลือกเดือน</label>
<select id="month"></select>
<div class="total" id="summary">กำลังโหลดข้อมูล...</div>
<div id="board" aria-live="polite"></div>
<p class="muted">คำนวณจากประวัติการเพิ่ม/ลดแต้มที่บันทึกไว้ โดยใช้เดือนตามเวลาไทย รายการที่ระบบเก่าไม่บันทึกวันเวลาหรือยังไม่ได้เก็บประวัติ อาจไม่รวมในผลลัพธ์</p>
<p class="center"><a href="./member.html">← กลับหน้าสมาชิก</a></p>
</main>
<script src="./js/firebase-config.js"></script>
<script>
const monthSelect=document.getElementById("month");
const summary=document.getElementById("summary");
const board=document.getElementById("board");
let users=new Map(), transactions=[];
function monthBangkok(date){
 const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok",year:"numeric",month:"2-digit"}).formatToParts(date);
 return p.find(x=>x.type==="year").value+"-"+p.find(x=>x.type==="month").value;
}
function setupMonths(){
 const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok",year:"numeric",month:"numeric"}).formatToParts(new Date());
 const year=Number(p.find(x=>x.type==="year").value);
 const month=Number(p.find(x=>x.type==="month").value);
 // Start with previous calendar month.
 for(let i=1;i<=24;i++){
  const date=new Date(Date.UTC(year,month-1-i,1));
  const option=document.createElement("option");
  option.value=date.toISOString().slice(0,7);
  option.textContent=date.toLocaleDateString("th-TH",{month:"long",year:"numeric",timeZone:"UTC"});
  monthSelect.appendChild(option);
 }
}
function render(){
 const month=monthSelect.value;
 const totals=new Map();
 let count=0;
 for(const tx of transactions){
  const d=tx.createdAt && typeof tx.createdAt.toDate==="function"?tx.createdAt.toDate():null;
  const txMonth=d?monthBangkok(d):(tx.monthId||tx.monthKey||"");
  if(txMonth!==month || !tx.userId)continue;
  const points=Number(tx.points||0);
  if(!Number.isFinite(points))continue;
  const u=users.get(tx.userId);
  if(!u || u.role!=="member")continue;
  totals.set(tx.userId,(totals.get(tx.userId)||0)+points);
  count++;
 }
 const rows=Array.from(totals,([id,points])=>({id,points,user:users.get(id)}))
   .filter(r=>r.points>0)
   .sort((a,b)=>b.points-a.points||String(a.user.memberId||"").localeCompare(String(b.user.memberId||"")));
 summary.textContent="เดือน "+month+" • "+rows.length+" คนมีแต้ม • "+count+" รายการบันทึก";
 board.replaceChildren();
 if(!rows.length){const p=document.createElement("p");p.className="muted center";p.textContent="ไม่พบสมาชิกที่มีแต้มในเดือนนี้";board.appendChild(p);return;}
 rows.forEach((r,i)=>{
  const row=document.createElement("div");row.className="ranking-row";
  const rank=document.createElement("span");rank.className="rank";
  rank.textContent=["🥇","🥈","🥉"][i]||"#"+(i+1);
  const img=document.createElement("img");img.className="avatar";img.alt="";
  if(r.user.pictureUrl && /^https:\/\/(profile\.line-scdn\.net|.*\.line-scdn\.net)\//.test(r.user.pictureUrl)) img.src=r.user.pictureUrl;
  const info=document.createElement("div");info.className="name";
  const name=document.createElement("strong");name.textContent=r.user.nickname||r.user.displayName||"สมาชิก";
  const id=document.createElement("div");id.className="muted";id.textContent=r.user.memberId||"-";
  info.append(name,id);
  const points=document.createElement("div");points.className="points";points.textContent=r.points+" แต้ม";
  row.append(rank,img,info,points);board.appendChild(row);
 });
}
async function init(){
 try{
  setupMonths();
  const result=await Promise.all([db.collection("users").get(),db.collection("pointTransactions").get()]);
  users=new Map(result[0].docs.map(d=>[d.id,d.data()]));
  transactions=result[1].docs.map(d=>d.data());
  monthSelect.addEventListener("change",render);
  render();
 }catch(e){
  console.error(e);summary.textContent="ไม่สามารถโหลดอันดับย้อนหลัง: "+e.message;
 }
}
init();
</script>
</body></html>
