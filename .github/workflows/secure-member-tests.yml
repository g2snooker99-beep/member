name: Secure Member emulator tests
on:
  push:
    branches: [feature/secure-pos-points]
    paths:
      - "functions/**"
      - "secure-public/**"
      - "firestore*.rules"
      - "firestore.indexes.json"
      - "firebase*.json"
      - ".github/workflows/secure-member-tests.yml"
  pull_request:
permissions:
  contents: read
jobs:
  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-g2-member
      GOOGLE_APPLICATION_CREDENTIALS: ''
      G2_MEMBER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Load production function declarations without cloud credentials
        working-directory: functions
        run: node -e 'require("./index.js")'
      - name: Real Firestore emulator security and transaction tests
        working-directory: functions
        run: npx firebase emulators:exec --project demo-g2-member --config ../firebase.secure.json --only firestore,auth 'npm test'
      - name: Install Chromium for UI acceptance
        working-directory: functions
        run: npx playwright install --with-deps chromium
      - name: Real Chromium staff and admin UI acceptance
        working-directory: functions
        run: npm run test:browser
